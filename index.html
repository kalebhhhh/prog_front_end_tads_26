<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Índice dos projetos desenvolvidos na disciplina de programação front-end."
    />
    <title>Projetos | Front-end TADS 2026</title>
    <style>
      @font-face {
        font-family: "Poppins";
        src: url("./tecboard/fonts/Poppins-Bold.ttf") format("truetype");
        font-weight: 700;
        font-display: swap;
      }

      @font-face {
        font-family: "Roboto";
        src: url("./tecboard/fonts/Roboto-Bold.ttf") format("truetype");
        font-weight: 400 700;
        font-display: swap;
      }

      :root {
        color-scheme: dark;
        --background: #0e1014;
        --surface: #171a21;
        --text: #fff;
        --muted: #b7b9c2;
        --accent: #9747ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 32px 24px 56px;
        background: var(--background);
        color: var(--text);
        font-family: "Roboto", Arial, sans-serif;
      }

      .container {
        width: min(100%, 960px);
        margin: 0 auto;
      }

      header {
        padding: 20px 0 64px;
      }

      .logo {
        display: block;
        width: min(100%, 190px);
        height: auto;
      }

      main {
        padding: clamp(28px, 7vw, 64px);
        border: 1px solid #292d37;
        border-radius: 24px;
        background: radial-gradient(ellipse at top left, #211831 0, var(--surface) 48%);
      }

      .eyebrow {
        margin: 0 0 12px;
        color: var(--accent);
        font-size: 0.875rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: "Poppins", Arial, sans-serif;
        font-size: clamp(2.25rem, 6vw, 4rem);
        line-height: 1.12;
      }

      .intro {
        max-width: 620px;
        margin: 20px 0 40px;
        color: var(--muted);
        font-size: clamp(1rem, 2.5vw, 1.2rem);
        line-height: 1.6;
      }

      h2 {
        margin: 0 0 16px;
        font-size: 1.125rem;
      }

      .project-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr));
        gap: 16px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .project-link {
        display: flex;
        min-height: 112px;
        flex-direction: column;
        justify-content: center;
        gap: 8px;
        padding: 22px 24px;
        border: 1px solid #383343;
        border-radius: 16px;
        background: #111319;
        color: var(--text);
        text-decoration: none;
        transition: border-color 160ms ease, transform 160ms ease, background 160ms ease;
      }

      .project-link:hover {
        transform: translateY(-2px);
        border-color: var(--accent);
        background: #1b1723;
      }

      .project-link:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 4px;
      }

      .project-name {
        font-size: 1.25rem;
        font-weight: 700;
      }

      .project-description {
        color: var(--muted);
        line-height: 1.45;
      }

      footer {
        margin-top: 24px;
        color: var(--muted);
        font-size: 0.875rem;
        text-align: center;
      }

      @media (max-width: 480px) {
        body {
          padding: 16px 16px 32px;
        }

        header {
          padding: 16px 0 40px;
        }

        .logo {
          width: 160px;
        }

        main {
          border-radius: 18px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <img
          class="logo"
          src="./tecboard/img/logo-tecboard-branco.png"
          alt="Tecboard"
        />
      </header>

      <main>
        <p class="eyebrow">TADS · 2026</p>
        <h1>Projetos front-end</h1>
        <p class="intro">
          Acesse os projetos desenvolvidos nos laboratórios da disciplina. Novos
          projetos em subpastas podem ser adicionados à lista abaixo.
        </p>

        <section aria-labelledby="projects-title">
          <h2 id="projects-title">Projetos disponíveis</h2>
          <ul class="project-list">
            <li>
              <a class="project-link" href="./tecboard/index.html">
                <span class="project-name">Tecboard</span>
                <span class="project-description">
                  Página de monitoramento com alertas inteligentes.
                </span>
              </a>
            </li>
            <!-- Para cada novo projeto, adicione um item apontando para ./nome-da-pasta/index.html. -->
          </ul>
        </section>
      </main>

      <footer>Programação Front-end · TADS 2026</footer>
    </div>
  </body>
</html>
